server:
  port: 2039

spring:
  application:
    name: agent-evimed
  servlet:
    multipart:
      max-request-size: 100MB
      max-file-size: 100MB




  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    username: ${ES_USERNAME:elastic}
    password: ${ES_PASSWORD:changeme}

  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:your-api-key}
      # 多API Key配置（可选，用逗号分隔多个key，用于故障转移和负载均衡）
      # api-keys: sk-key1,sk-key2,sk-key3  # 当主key失败时自动切换到备用key
      api-keys: ${DASHSCOPE_API_KEYS:}
      connect-timeout: 30000     # 连接超时：30秒（增加到30秒，提高稳定性）
      read-timeout: 60000       # 读取超时：60秒（增加到60秒）
      write-timeout: 30000       # 写入超时：30秒（增加到30秒）
      max-retries: 3             # 最多重试3次
      chat:
        options:
          model: qwen3-235b-a22b-instruct-2507         # 模型名称（确保已开通权限）
      connection-pool:
        max-total: 200           # 总连接数（从100增加到200，支持更高并发）
        max-per-route: 50        # 每个路由最大连接数（从20增加到50）
        validate-after-inactivity: 5000  # 空闲验证间隔（毫秒）
      # LLM错误处理配置（优化高并发场景）
      retry:
        max-attempts: 4           # 最大重试次数（增加到4次，提高成功率）
        initial-interval: 2000    # 初始重试延迟（增加到2秒，避免瞬时压力）
        multiplier: 1.5           # 指数退避倍数（降低到1.5，避免等待时间过长）
        max-interval: 15000       # 最大重试间隔（增加到15秒）
      timeout:
        connect: 30000            # 连接超时（增加到30秒）
        read: 60000               # 读取超时（增加到60秒）
        total: 120000             # 总超时（增加到120秒，支持复杂查询）
        stream-stall: 30000       # 流式响应卡死检测阈值（增加到30秒）
      circuit-breaker:
        failure-threshold: 10     # 失败阈值（增加到10，更宽容）
        wait-duration: 30000      # 熔断等待时间（降低到30秒，加快恢复）
        sliding-window-size: 20   # 滑动窗口大小（增加到20，更准确的统计）
      user-feedback:
        thinking-delay: 5000      # 首次响应延迟提示阈值（增加到5秒）
      # 并发控制配置（新增）
      concurrency:
        max-concurrent: 50        # 最大并发请求数
        max-queue-size: 200       # 最大队列长度
        acquire-timeout: 120      # 获取许可超时时间（秒）


  cloud:
    inetutils:
      ignoredInterfaces:
        - VMware.* # 忽略虚拟机网卡
      use-only-site-local-interfaces: true
      preferred-networks: 192.168.0.*

  # mongodb的连接
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/evimed_new}
      # 超时配置
      socket-timeout: 6000      # Socket读取超时时间，6秒
      connection-timeout: 30000  # 连接超时时间，3秒
      max-wait-time: 12000


    #Rides集群
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:2}
      timeout: 100000
      password: ${REDIS_PASSWORD:}
      lettuce:
        shutdown-timeout: 2000ms
    #    #Rides单体
    #    redis:
    #      #host: 121.36.90.131
    #      host: 192.168.20.252
    #      port: 6379
    #      database: 1
    #      timeout: 10000
    #      password: ndyx@123
    #      lettuce:
    #        shutdown-timeout: 2000ms
session:
  storage:
    mongo:
      # 会话过期时间（秒）
      expire-time: 2592000  # 30天 = 3600 * 24 * 30
      # 清理过期会话的定时任务CRON表达式
      cleanup-cron: "0 0 * * * ?"  # 每小时执行一次
      # Redis键前缀配置
      key-prefix:
        session: "session:"
        user-sessions: "user_sessions:"
      # SCAN命令分批大小
      scan-batch-size: 1000
      # 优化后的键名格式，支持应用名称动态注入
      enable-application-prefix: true






  kafka:
    #集群
    bootstrap-servers: 192.168.20.253:9092
    producer:
      # 发生错误后，消息重发的次数。
      retries: 0
      # 当有多个消息需要被发送到同一个分区时，生产者会把它们放在同一个批次里。
      # 该参数指定了一个批次可以使用的内存大小，按照字节数计算。
      batch-size: 16384
      # 设置生产者内存缓冲区的大小。
      buffer-memory: 33554432
      # procedure要求leader在考虑完成请求之前收到的确认数，用于控制发送记录在服务端的持久化，其值可以为如下：
      # acks = 0 如果设置为零，则生产者将不会等待来自服务器的任何确认，该记录将立即添加到套接字缓冲区并视为已发送。在这种情况下，无法保证服务器已收到记录，并且重试配置将不会生效（因为客户端通常不会知道任何故障），为每条记录返回的偏移量始终设置为-1。
      # acks = 1 这意味着leader会将记录写入其本地日志，但无需等待所有副本服务器的完全确认即可做出回应，在这种情况下，如果leader在确认记录后立即失败，但在将数据复制到所有的副本服务器之前，则记录将会丢失。
      # acks = all 这意味着leader将等待完整的同步副本集以确认记录，这保证了只要至少一个同步副本服务器仍然存活，记录就不会丢失，这是最强有力的保证，这相当于acks = -1的设置。
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # 值的序列化方式
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      # 自动提交的时间间隔,默认5秒

      auto-commit-interval: 1S
      # 该属性指定了消费者在读取一个没有偏移量的分区或者偏移量无效的情况下该作何处理：
      # latest（默认值）在偏移量无效的情况下，消费者将从最新的记录开始读取数据（在消费者启动之后生成的记录）
      # earliest ：在偏移量无效的情况下，消费者将从起始位置读取分区的记录
      auto-offset-reset: latest
      # 是否自动提交偏移量，默认值是true,为了避免出现重复数据和数据丢失，可以把它设置为false,然后手动提交偏移量
      #enable-auto-commit: false
      enable-auto-commit: true
      # 键的反序列化方式
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 值的反序列化方式
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # 在侦听器容器中运行的线程数。
      concurrency: 5
      #listner负责ack，每调用一次，就立即commit
      #ack-mode: manual_immediate

feign:
  hystrix:
    enabled: false
  client:
    config:
      default:
        #建立连接所用的时间，适用于网络状况正常的情况下，两端连接所需要的时间
        ConnectTimeOut: 15000000
        #指建立连接后从服务端读取到可用资源所用的时间
        ReadTimeOut: 15000000


